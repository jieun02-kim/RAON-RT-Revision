; default 0 -> SM-sync). To experiment with DC sync0 later, uncomment on every
; drive axis; slave 0 then also becomes the app's DC reference clock:
;DC_SUPPORT=1
;DC_ACTIVATE_WORD=0x300
;DC_SYNC0_SHIFT=0
