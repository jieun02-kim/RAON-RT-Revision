[SYSTEM]
NAME=INDY7
SIMULATION_MODE=0
EXTERNAL_INTERFACE_ENABLED=1
EXTERNAL_INTERFACE_PORT=7420
TELEOPERATION_MODE=2
TELEOPERATION_CONSTANT_SCALING=0.3
URDF_PATH=/home/ubuntu/RAON-RT-Revision/App/Indy7/indy7.urdf
; [kv260-merge] bring-up safety: controller enabled manually ('r' key), not at startup
ENABLE_CONTROLLER_AT_STARTUP=0
DEFAULT_CONTROLLER_MODE=0
ROBOT_DOF=6
KP_0=800.0
KD_0=80.0
KP_1=600.0
KD_1=60.0
KP_2=400.0
KD_2=40.0
KP_3=200.0
KD_3=20.0
KP_4=150.0
KD_4=15.0
KP_5=100.0
KD_5=10.0

;==========================================================================
; Real-time Tasks
; TASK_PERIOD : period in nanoseconds
; START_DELAY : delay execution of tasks in nanoseconds
; PRIORITY : 0 (lowest) - 99 (highest)
;==========================================================================
; [kv260-merge] 5 tasks: Visual Servo task removed (TASK5 section below is unread)
[RT_TASKS]
NO_OF_TASKS=5

[TASK0]
ENABLED=1
NAME=Main Control Task
PRIORITY=97
TASK_PERIOD=1000000
START_DELAY=0

[TASK1]
ENABLED=1
NAME=EtherCAT Control Task
PRIORITY=95
TASK_PERIOD=1000000
START_DELAY=0

[TASK2]
ENABLED=1
NAME=Keyboard Input Task
PRIORITY=50
TASK_PERIOD=0
START_DELAY=0

[TASK3]
ENABLED=1
NAME=Terminal Printer
PRIORITY=49
TASK_PERIOD=1000000000
START_DELAY=0

[TASK4]
ENABLED=1
NAME=Logger
PRIORITY=30
TASK_PERIOD=0
START_DELAY=0

[TASK5]
ENABLED=0
NAME=Visual Servo Task (removed on kv260-merge)
PRIORITY=20
TASK_PERIOD=0
START_DELAY=0


;==========================================================================
; DC_ENABLED : Number of Slaves
; DC_ENABLED : Enable distributed clock
; CYCLE_TIME : EtherCAT cycle time in nanoseconds (todo: depend on the main control task period)
;==========================================================================
[ECAT_MASTER]
SLAVENUMBER=7
DC_ENABLED=1
CYCLE_TIME=1000000

